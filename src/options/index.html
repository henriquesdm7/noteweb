<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoteWeb · Todas as notas</title>
  </head>
  <body>
    <main class="options">
      <header class="top">
        <div class="brand">
          <img src="/icons/icon-48.png" alt="" width="32" height="32" />
          <div>
            <h1>NoteWeb</h1>
            <p id="summary" class="muted">Carregando…</p>
          </div>
        </div>
        <div class="actions">
          <button id="export" class="btn" type="button">Exportar backup</button>
          <button id="import" class="btn primary" type="button">Importar backup</button>
          <input id="import-file" type="file" accept="application/json,.json" hidden />
        </div>
      </header>

      <p id="status" class="status" role="status" aria-live="polite" hidden></p>

      <input id="search" class="search" type="search" placeholder="Buscar por texto ou endereço…" aria-label="Buscar notas" />

      <div id="pages" class="pages"></div>
      <p id="empty" class="empty" hidden>Nenhuma nota salva ainda. Abra uma página e crie a primeira pelo ícone do NoteWeb.</p>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
